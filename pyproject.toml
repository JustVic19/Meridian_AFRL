[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-intelligence-lab"
version = "0.1.0"
description = "Financial Intelligence Lab — research skeleton for US public equities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.0",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["services", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services", "packages"]
addopts = "-v --tb=short"

[tool.ruff]
src = ["services", "packages", "tests", "migrations"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["agents", "api", "data", "prompts", "research", "schemas"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "services:packages"
packages = ["agents", "api", "data", "prompts", "research", "schemas"]
